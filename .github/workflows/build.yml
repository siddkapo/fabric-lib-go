# SPDX-License-Identifier: Apache-2.0

name: Verify Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  workflow_call:

env:
  GOPATH: /opt/go
  PATH: /opt/go/bin:/bin:/usr/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/local/sbin
  GO_VER: 1.24.2

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VER }}
      - name: Checkout Fabric-Lib-Go Code
        uses: actions/checkout@v3
      - name: Install SoftHSM
        run: scripts/setup_hsm.sh
      - name: Run Checks and Unit Tests
        run: make checks unit-tests GOTOOLS_BINDIR=${{ env.GOPATH }}/bin

  falcon-tests:
    name: Falcon BCCSP Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VER }}
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config curl
      # Exercise the optional backend on a fresh clone, independently of SoftHSM.
      - name: Build and test with liboqs
        run: make build-pq test-pq
